<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Reminders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-center">My Reminders</h2>

        <!-- Display Success or Error Messages -->
        <div th:if="${success}" class="alert alert-success">
            <p th:text="${success}"></p>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <p th:text="${error}"></p>
        </div>

        <!-- Loop through each reminder -->
        <div th:each="reminder : ${reminders}">
    <div class="card mb-3" th:if="${reminder.status != 'DONE'}">
        <div class="card-body">
            <h5 class="card-title" th:text="'Reminder for: ' + ${reminder.document.title}"></h5>
            <p class="card-text" th:text="'Document ID: ' + ${reminder.document.id}"></p>
            <p class="card-text" th:text="'Expiry Date: ' + ${reminder.document.expiryDate}"></p>
            <p class="card-text" th:text="'Reminder Time: ' + ${#temporals.format(reminder.sentTime, 'dd MMM yyyy, HH:mm')}"></p>

<!-- Mark as Done button -->
<form th:action="@{'/reminder/mark-done/' + ${reminder.id}}" method="post" th:if="${reminder.status != 'DONE'}">
    <button type="submit" class="btn btn-outline-success">Mark as Done</button>
</form>
                    
                    
                    <!-- Link to View Reminder -->
                    
                </div>
            </div>
        </div>
        
        
        <!-- Back Button -->
        <a href="/" class="btn btn-outline-secondary mt-3">Back to Documents</a>
    </div>
</body>
</html>
