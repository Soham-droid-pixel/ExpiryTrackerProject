<!-- templates/set-reminder.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Set Reminder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h3>Set Reminder for Document</h3>
    <!-- Flash Messages -->
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <form th:action="@{/reminders/set-reminder}" method="post">
        <input type="hidden" th:name="documentId" th:value="${document.id}"/>

        <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="email" name="recipientEmail" th:value="${userEmail}" required>
        </div>

        <div class="mb-3">
            <label for="reminderTime" class="form-label">Reminder Time</label>
            <input type="datetime-local" class="form-control" id="reminderTime" name="reminderTime" required>
        </div>

        <button type="submit" class="btn btn-success">Set Reminder</button>
    </form>
</div>
</body>
</html>
