<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Documents</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-center">Your Expiring Documents</h2>

        <a href="/add" class="btn btn-success mb-3">Add New Document</a>

        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Expiry Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="doc : ${documents}">
                    <td th:text="${doc.title}"></td>
                    <td th:text="${doc.description}"></td>
                    <!-- Replace this line -->
<td th:text="${#temporals.format(doc.expiryDate, 'yyyy-MM-dd')}"></td>
                    <td>
                        <a th:href="@{/edit/{id}(id=${doc.id})}" class="btn btn-primary btn-sm">Edit</a>
                        <form th:action="@{/delete/{id}(id=${doc.id})}" method="post" style="display:inline;">
    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</button>
</form>
<a th:href="@{/set-reminder/{id}(id=${doc.id})}" class="btn btn-warning">Set Reminder</a>

                    </td>
                </tr>
            </tbody>
        </table>

        <a href="/logout" class="btn btn-outline-danger">Logout</a>
    </div>
</body>
</html>
