<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4" th:text="${document.id} != null ? 'Edit Document' : 'Add Document'"></h2>

        <!-- 🟢 Change #1: Dynamic form action -->
        <form th:action="${document.id} != null ? @{'/edit/' + ${document.id}} : @{/add}" 
              th:object="${document}" 
              method="post" 
              class="bg-white p-4 rounded shadow-sm">

            <!-- 🟢 Change #2: Hidden field to retain document ID during editing -->
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" th:field="*{title}" class="form-control" id="title" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" id="description" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label for="expiryDate" class="form-label">Expiry Date</label>
                <input type="date" th:field="*{expiryDate}" class="form-control" id="expiryDate" required>
            </div>

            <button type="submit" class="btn btn-primary"
                th:text="${document.id} != null ? 'Update Document' : 'Save Document'">
                Save Document
            </button>

            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
